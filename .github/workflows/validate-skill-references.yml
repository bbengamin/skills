name: Validate skill references

on:
  pull_request:
  push:
    branches: [main]

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest scripts.tests.test_sync_skill_references
      - run: python3 scripts/sync_skill_references.py --check
