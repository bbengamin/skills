name: Validate skill references

on:
  pull_request:
  push:
    branches: [main]

jobs:
  references:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest scripts.tests.test_sync_skill_references
      - run: python3 scripts/sync_skill_references.py --check
